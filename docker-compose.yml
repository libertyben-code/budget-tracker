services:
  # Tailscale joins the tailnet as its own machine named `budget`, so the app gets
  # https://budget.<tailnet>.ts.net rather than sharing the host's name on a spare port.
  # Android matches an installed PWA on hostname and ignores the port, so two apps behind
  # one hostname can never both be installed — a name each is the only fix. See docs/V2-SETUP.md.
  ts-budget:
    # Pinned, not :latest — this container is the network perimeter, and an unreviewed image
    # landing on a routine redeploy is not a thing you want to discover afterwards. Bump it
    # deliberately.
    image: tailscale/tailscale:v1.102.3
    container_name: ts-budget
    hostname: budget
    environment:
      # Reusable (not ephemeral) auth key, set as a Portainer stack variable. It is consumed
      # only on first start — after that the node identity lives in the state volume below.
      TS_AUTHKEY: "${TS_AUTHKEY:?generate a reusable auth key in the Tailscale admin console}"
      # Explicit rather than inherited from `hostname:` below — this is the name the tailnet
      # sees, and it is what the PWA install is keyed on, so it should not depend on a default.
      TS_HOSTNAME: budget
      TS_SERVE_CONFIG: /config/serve-config.json
      # Empty by default. Set this in the stack to "--advertise-tags=tag:budget" once you
      # have an auth key generated WITH that tag — a tagged node can be named directly in an
      # ACL grant, and never expires. Advertising a tag the key does not carry fails
      # registration, so the two must change together.
      TS_EXTRA_ARGS: "${TS_EXTRA_ARGS:-}"
      TS_STATE_DIR: /var/lib/tailscale
    volumes:
      # Named volume, not a bind mount: Portainer re-clones the repo on every git update, so
      # anything under the stack directory is at risk. Losing this means re-authenticating.
      - ts-budget-state:/var/lib/tailscale
    configs:
      # Inlined at the bottom of this file rather than bind-mounted from the repo. Docker
      # silently creates a *directory* when a bind-mount source file is missing, and
      # Portainer's clone stopped picking up files under tailscale/ — so every deploy mounted
      # a directory and tailscaled refused to read it. Compose materialises this content
      # itself, so there is no source path on disk for Docker to fabricate.
      - source: ts-serve
        target: /config/serve-config.json
    restart: unless-stopped
    # Runs in userspace networking (the image default), which is enough to accept inbound
    # traffic and proxy it to a local port. If the sidecar fails to come up, kernel mode is
    # the fallback: add TS_USERSPACE: "false", devices [/dev/net/tun:/dev/net/tun] and
    # cap_add [net_admin].

  budget:
    build: .
    container_name: budget-tracker
    restart: unless-stopped
    # Shares the sidecar's network namespace: same interfaces, same localhost. That is how
    # the serve config reaches the app on 127.0.0.1:3000. It also means this container can have no
    # `ports:` of its own — it has no network of its own to publish on. Nothing is bound on
    # the host at all now, so the tailnet is the only way in.
    network_mode: service:ts-budget
    depends_on:
      - ts-budget
    environment:
      # Loopback, not 0.0.0.0. In the shared namespace 0.0.0.0 would include the sidecar's
      # tailnet IP, publishing the API to every device on the tailnet over plain HTTP and
      # bypassing the TLS proxy entirely. The proxy reaches it on 127.0.0.1 regardless.
      HOST: 127.0.0.1
    volumes:
      # Set DATA_DIR as a Portainer stack variable, to an absolute host path. Deliberately has
      # no default: a relative path resolves inside Portainer's own volume (/data/compose/<stack-id>)
      # rather than on the host, so a wrong value starts a healthy stack on an empty database and
      # reads as data loss. Failing the deploy on an unset variable is the safe way to be wrong.
      - "${DATA_DIR:?set DATA_DIR to the absolute host path of the data folder}:/data"
    healthcheck:
      # Still localhost:3000 — the shared namespace means the app's own port is local to it.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s

volumes:
  ts-budget-state:

configs:
  ts-serve:
    # `$$` escapes the dollar so Compose passes a literal ${TS_CERT_DOMAIN} through to
    # tailscaled, which substitutes this node's own cert name at runtime. A single `$` would
    # interpolate to an empty string at deploy time and the proxy would serve nothing.
    content: |
      {
        "TCP": { "443": { "HTTPS": true } },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": { "/": { "Proxy": "http://127.0.0.1:3000" } }
          }
        }
      }
